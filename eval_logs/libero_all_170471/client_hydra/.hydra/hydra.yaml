hydra:
  run:
    dir: /mnt/cluster/workspaces/naguibchr/VersatIL/eval_logs/libero_all_170471/client_hydra
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/mnt/cluster/workspaces/naguibchr/VersatIL/eval_logs/libero_all_170471/client_hydra
    - hydra.mode=RUN
    task:
    - checkpoint_path=/mnt/cluster/workspaces/naguibchr/VersatIL/checkpoints/libero/smolvla/20260915_160721/compressed/20260930_190811
    - device=cuda
    - compile_model=false
    - max_steps=1000000
    - client.model_server_address=127.0.0.1
    - client.model_server_port=5551
    - client.compression_type=raw
    - client.temporal_aggregation=true
    - client.temporal_max_timesteps=800
    - client.request_timeout_seconds=60
  job:
    name: deploy
    chdir: null
    override_dirname: ${hydra_override_dirname:}
    id: ???
    num: ???
    config_name: end_to_end_deploy/default.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.4.0.dev5
    version_base: '1.4'
    cwd: /mnt/cluster/workspaces/naguibchr/VersatIL
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /mnt/cluster/workspaces/naguibchr/VersatIL/src/versatil/hydra_configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /mnt/cluster/workspaces/naguibchr/VersatIL/eval_logs/libero_all_170471/client_hydra
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
