# @package _global_
defaults:
  - /post_training_compression
  - _self_

checkpoint_path: ???
checkpoint_name: last.ckpt
output_directory: null
calibration_steps: 16
preparation:
  replace_frozen_batchnorm: false
  fuse_conv_batchnorm: false

pruning: null
quantization:
  _target_: versatil.quantization.workflows.pt2e.PT2EQuantizationWorkflow
  targets:
    # - _target_: versatil.quantization.module_target.PT2EQuantizationModuleTarget
    #   module_path: decoder.vlm_backbone.vlm.base_model.model.model.vision_model
    #   pt2e_backend:
    #     _target_: versatil.quantization.pt2e.backends.x86_inductor.X86InductorBackend
    #     is_dynamic: false
    #     weight_quantization:
    #       bit_width: 8
    #       quant_min: -128
    #       quant_max: 127
    #       qscheme: per_channel_symmetric # [vocab_size, embedding_dim] --> one scale per word
    #       ch_axis: 0
    #       quantize_bias: false
    #     activation_quantization:
    #       bit_width: 8
    #       quant_min: -128
    #       quant_max: 127
    #       qscheme: per_tensor_affine
    #       ch_axis: null
    #       is_dynamic: false
    - _target_: versatil.quantization.module_target.PT2EQuantizationModuleTarget
      module_path: decoder.vlm_backbone.vlm.base_model.model.model.text_model
      pt2e_backend:
        _target_: versatil.quantization.pt2e.backends.x86_inductor.X86InductorBackend
        is_dynamic: false
        weight_quantization:
          bit_width: 8
          quant_min: -128
          quant_max: 127
          qscheme: per_channel_symmetric
          ch_axis: 0
          quantize_bias: false
        activation_quantization:
          bit_width: 8
          quant_min: -128
          quant_max: 127
          qscheme: per_tensor_affine
          ch_axis: null
          is_dynamic: false
    - _target_: versatil.quantization.module_target.PT2EQuantizationModuleTarget
      module_path: decoder.expert_layers
      pt2e_backend:
        _target_: versatil.quantization.pt2e.backends.x86_inductor.X86InductorBackend
        is_dynamic: false
        weight_quantization:
          bit_width: 8
          quant_min: -128
          quant_max: 127
          qscheme: per_channel_symmetric
          ch_axis: 0
          quantize_bias: false
        activation_quantization:
          bit_width: 8
          quant_min: -128
          quant_max: 127
          qscheme: per_tensor_affine
          ch_axis: null
          is_dynamic: false

modules:
  # - module_path: decoder.vlm_backbone.vlm.base_model.model.model.vision_model
  #   preparation: ${preparation}
  #   pruning: null
  # - module_path: decoder.vlm_backbone.vlm.base_model.model.model.connector
  #   preparation: ${preparation}
    # pruning: null
  - module_path: decoder.vlm_backbone.vlm.base_model.model.model.text_model
    preparation: ${preparation}
    pruning: null
  - module_path: decoder.expert_layers
    preparation: ${preparation}
    pruning: null

