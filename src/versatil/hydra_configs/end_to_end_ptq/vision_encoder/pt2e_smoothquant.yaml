# @package _global_
defaults:
  - /post_training_compression
  - _self_

checkpoint_path: ???
checkpoint_name: last.ckpt
output_directory: null
calibration_steps: 16
preparation:
  replace_frozen_batchnorm: true
  fuse_conv_batchnorm: true
pruning: null
quantization:
  _target_: versatil.quantization.workflows.pt2e.PT2EQuantizationWorkflow
  targets:
    - _target_: versatil.quantization.module_target.PT2EQuantizationModuleTarget
      module_path: encoding_pipeline.encoders.left
      smooth_quant: true
      smooth_quant_alpha: 0.5
      pt2e_backend:
        _target_: versatil.quantization.pt2e.backends.x86_inductor.X86InductorBackend
        is_dynamic: false
        weight_quantization:
          bit_width: 4
          quant_min: -8
          quant_max: 7
          qscheme: per_channel_symmetric
          ch_axis: 0
          quantize_bias: false
        activation_quantization:
          bit_width: 8
          quant_min: -128
          quant_max: 127
          qscheme: per_tensor_affine
          ch_axis: null
          is_dynamic: false
    - _target_: versatil.quantization.module_target.PT2EQuantizationModuleTarget
      module_path: encoding_pipeline.encoders.right
      smooth_quant: true
      smooth_quant_alpha: 0.5
      pt2e_backend:
        _target_: versatil.quantization.pt2e.backends.x86_inductor.X86InductorBackend
        is_dynamic: false
        weight_quantization:
          bit_width: 4
          quant_min: -8
          quant_max: 7
          qscheme: per_channel_symmetric
          ch_axis: 0
          quantize_bias: false
        activation_quantization:
          bit_width: 8
          quant_min: -128
          quant_max: 127
          qscheme: per_tensor_affine
          ch_axis: null
          is_dynamic: false
modules:
  - module_path: encoding_pipeline.encoders.left
    preparation: ${preparation}
    pruning: null
  - module_path: encoding_pipeline.encoders.right
    preparation: ${preparation}
    pruning: null
