# @package _global_
defaults:
  - /post_training_compression
  - _self_

checkpoint_path: ???
checkpoint_name: last.ckpt
output_directory: null
calibration_steps: 16 
preparation:
  replace_frozen_batchnorm: true
  fuse_conv_batchnorm: true
pruning:
  - _target_: versatil.post_training_compression.pruning.iterativeprunner.IterativeCalibrationPruner
    T: 3
    initial_sparsity: 0.01
    final_sparsity: 0.2
    calibration_steps: 16 

quantization: null
modules:
  - module_path: encoding_pipeline.encoders.left
    preparation: ${preparation}
    pruning: ${pruning}
  - module_path: encoding_pipeline.encoders.right
    preparation: ${preparation}
    pruning: ${pruning}
