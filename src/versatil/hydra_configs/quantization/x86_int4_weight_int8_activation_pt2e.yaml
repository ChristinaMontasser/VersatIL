defaults:
  - /quantization/workflow/pt2e
  - _self_

targets:
  - _target_: versatil.quantization.module_target.PT2EQuantizationModuleTarget
    module_path: ""
    pt2e_backend:
      _target_: versatil.quantization.pt2e.backends.x86_inductor.X86InductorBackend
      is_dynamic: false
      is_qat: false
      reduce_range: false
      weight_quantization:
        bit_width: 4
        quant_min: -8
        quant_max: 7
        qscheme: per_channel_symmetric
        ch_axis: 0
        quantize_bias: false
      activation_quantization:
        bit_width: 8
        quant_min: -128
        quant_max: 127
        qscheme: per_tensor_affine
        ch_axis: null
        is_dynamic: false
